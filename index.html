<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───── TOP BAR ───── -->
    <header class="top-bar">
      <div id="greeting-section">
        <p id="greeting-text">Hello!</p>
        <p id="datetime-text"></p>
      </div>
      <div class="top-bar-controls">
        <button id="name-btn" class="icon-btn" title="Set your name">✏️</button>
        <button id="theme-btn" class="icon-btn" title="Toggle dark/light mode">🌙</button>
      </div>
    </header>

    <!-- ───── NAME MODAL ───── -->
    <div id="name-modal" class="modal hidden">
      <div class="modal-box">
        <h2>What's your name?</h2>
        <input type="text" id="name-input" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button id="name-save-btn" class="btn-primary">Save</button>
          <button id="name-cancel-btn" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <main class="dashboard">

      <!-- ───── FOCUS TIMER ───── -->
      <section class="card" id="timer-card">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <div class="timer-duration-row">
          <label for="timer-duration">Minutes:</label>
          <input type="number" id="timer-duration" min="1" max="120" value="25" />
          <button id="set-duration-btn" class="btn-secondary">Set</button>
        </div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn-primary">Start</button>
          <button id="stop-btn" class="btn-secondary">Stop</button>
          <button id="reset-btn" class="btn-secondary">Reset</button>
        </div>
      </section>

      <!-- ───── TO-DO LIST ───── -->
      <section class="card" id="todo-card">
        <h2 class="card-title">📝 To-Do List</h2>
        <div class="todo-add-row">
          <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="100" />
          <button id="todo-add-btn" class="btn-primary">Add</button>
        </div>
        <div class="todo-controls">
          <label for="sort-select">Sort:</label>
          <select id="sort-select">
            <option value="none">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done">Done last</option>
          </select>
        </div>
        <ul id="todo-list"></ul>
      </section>

      <!-- ───── QUICK LINKS ───── -->
      <section class="card" id="links-card">
        <h2 class="card-title">🔗 Quick Links</h2>
        <div class="link-add-row">
          <input type="text" id="link-name-input" placeholder="Label" maxlength="30" />
          <input type="url" id="link-url-input" placeholder="https://…" />
          <button id="link-add-btn" class="btn-primary">Add</button>
        </div>
        <div id="links-container"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
